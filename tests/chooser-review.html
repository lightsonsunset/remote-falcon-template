<!doctype html><html lang="en"><meta charset="utf-8"><title>Template chooser review</title><style>body{margin:0;background:#f6f5ef;font:14px system-ui}nav{display:flex;gap:8px;padding:8px}button{padding:8px}iframe{display:block;width:390px;height:650px;border:0}</style><nav><button data-width="320">320 short</button><button data-width="390">390 phone</button><button data-width="1280">Desktop</button><button id="colour">Light / dark</button><button id="open">Open chooser</button></nav><iframe src="../" title="Local template chooser"></iframe><script type="module">
if(location.hostname!=='localhost'||['4188','4198'].includes(location.port))throw Error('Use a disposable review origin.');
const frame=document.querySelector('iframe');
document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{frame.style.width=b.dataset.width+'px';frame.style.height=b.dataset.width==='320'?'480px':'650px';});
document.querySelector('#colour').onclick=()=>{const root=frame.contentDocument.documentElement;root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';};
document.querySelector('#open').onclick=()=>{const button=frame.contentDocument.querySelector('#choose-template');button.focus();button.click();};
</script></html>
