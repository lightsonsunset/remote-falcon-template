name: Suggest an improvement
description: Suggest an improvement to the supplied templates or shared customiser.
title: "[Idea] "
body:
  - type: textarea
    id: need
    attributes:
      label: What would this help you do?
      description: Explain the use case and your suggested change.
    validations:
      required: true
  - type: markdown
    attributes:
      value: "This customiser personalises supplied Remote Falcon templates. Please keep private settings and account details out of your suggestion."
